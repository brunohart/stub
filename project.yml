name: Stub
options:
  bundleIdPrefix: com.designedbybruno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # Bruno's team, for the phone and TestFlight (docs/device.md §1). The simulator build does not need it.
    DEVELOPMENT_TEAM: 7CLZHA268P
    # One version for the app and the widget; scripts/archive.sh sets the build to the commit count per upload.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
targets:
  Stub:
    type: application
    platform: iOS
    sources:
      - path: Stub
    info:
      path: Stub/Info.plist
      properties:
        CFBundleDisplayName: Stub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Parchment from the first frame: an empty launch screen is white, and the drawer faded in from white (ADR-022).
        UILaunchScreen:
          UIColorName: LaunchPaper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - HostGrotesk-Variable.ttf
          - HostGrotesk-Italic-Variable.ttf
          - Newsreader-Variable.ttf
          - Newsreader-Italic-Variable.ttf
          - FragmentMono-Regular.ttf
          - FragmentMono-Italic.ttf
        NSCameraUsageDescription: Stub photographs your ticket stub, and puts its edition on your table. Nothing from the camera leaves this device.
        NSPhotoLibraryUsageDescription: Stub reads ticket stubs from your library. Nothing is uploaded.
        # No network, no crypto of our own (ADR-005): answers App Store Connect's export question for every upload.
        ITSAppUsesNonExemptEncryption: false
        # ProMotion at its full 120 Hz, so the press wheel's in-betweens are not capped at 60 (ADR-016).
        CADisableMinimumFrameDurationOnPhone: true
        # CloudKit's silent pushes say another phone changed the drawer (ADR-024).
        UIBackgroundModes: [remote-notification]
    # The drawer lives in an App Group so the widget can read it (Day 5). Generated, like Info.plist.
    # Add to Stub links open the app (ADR-021); a Debug build reads the association file straight from the site
    # (STUB_APPLINKS_MODE), since Apple's CDN takes a day to see a new one.
    entitlements:
      path: Stub/Stub.entitlements
      properties:
        com.apple.security.application-groups: [group.com.designedbybruno.stub]
        com.apple.developer.associated-domains: ["applinks:designedbybruno.net$(STUB_APPLINKS_MODE)"]
        # The drawer in the person's own private iCloud (ADR-024). Without these CloudKit stops the app the moment it is
        # asked for the container, so they are always here; the person turns sync off in Settings, not the build.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.designedbybruno.stub]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - target: StubWidget
      - target: StubShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub
        PRODUCT_NAME: Stub
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        # The icon is drawn by scripts/make-icon.swift into Stub/Resources/Assets.xcassets (Day 6).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          STUB_APPLINKS_MODE: "?mode=developer"
        # The fixtures are for the seed and the tests, both Debug only; a phone's Release build does not carry them.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "stub-*.png stub-*.pdf"
          STUB_APPLINKS_MODE: ""
  # The widget: the last stub on the lock screen and the home screen. Shares the model, the inks, the type
  # tokens and the store with the app by compiling the same files; nothing it shares may need Metal or UIKit.
  StubWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StubWidget
      - path: Stub/Models/Stub.swift
      - path: Stub/Design/Ink.swift
      - path: Stub/Design/Type.swift
      - path: Stub/Reach/SharedStore.swift
      - path: Stub/Reach/AppGroup.swift
      - path: Stub/Resources/Fonts/HostGrotesk-Variable.ttf
        buildPhase: resources
      - path: Stub/Resources/Fonts/FragmentMono-Regular.ttf
        buildPhase: resources
    info:
      path: StubWidget/Info.plist
      properties:
        CFBundleDisplayName: Stub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - HostGrotesk-Variable.ttf
          - FragmentMono-Regular.ttf
    entitlements:
      path: StubWidget/StubWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.designedbybruno.stub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub.widget
        PRODUCT_NAME: StubWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The share extension (BEDIP-218, ADR-023): takes a Wallet pass, a PDF or a picture from any app's share sheet and leaves
  # it in the App Group's inbox for the app. It compiles only what it needs to show the ticket: no store, no Vision, no
  # model, no Metal.
  StubShare:
    type: app-extension
    platform: iOS
    sources:
      - path: StubShare
      - path: Stub/Reach/AppGroup.swift
      - path: Stub/Reach/Inbox.swift
      - path: Stub/Reach/Zip.swift
      - path: Stub/Reach/WalletPass.swift
      - path: Stub/Reach/AddLink.swift
      - path: Stub/Reach/PageImage.swift
      - path: Stub/Intelligence/StubDraft.swift
      - path: Stub/Design/Ink.swift
      - path: Stub/Design/Type.swift
      - path: Stub/Design/Stamp.swift
      - path: Stub/Resources/Fonts/HostGrotesk-Variable.ttf
        buildPhase: resources
      - path: Stub/Resources/Fonts/FragmentMono-Regular.ttf
        buildPhase: resources
    info:
      path: StubShare/Info.plist
      properties:
        CFBundleDisplayName: Stub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One item: a Wallet pass, a PDF or a picture.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.pkpass"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count == 1).@count == 1
        UIAppFonts:
          - HostGrotesk-Variable.ttf
          - FragmentMono-Regular.ttf
    entitlements:
      path: StubShare/StubShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.designedbybruno.stub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub.share
        PRODUCT_NAME: StubShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  StubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StubTests
    dependencies:
      - target: Stub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stub:
    build:
      targets:
        Stub: all
        StubWidget: all
        StubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StubTests]
