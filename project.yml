name: Stub
options:
  bundleIdPrefix: com.designedbybruno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
targets:
  Stub:
    type: application
    platform: iOS
    sources:
      - path: Stub
    info:
      path: Stub/Info.plist
      properties:
        CFBundleDisplayName: Stub
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - HostGrotesk-Variable.ttf
          - HostGrotesk-Italic-Variable.ttf
          - Newsreader-Variable.ttf
          - Newsreader-Italic-Variable.ttf
          - FragmentMono-Regular.ttf
          - FragmentMono-Italic.ttf
        NSCameraUsageDescription: Stub photographs your ticket stub. The photo stays on this device.
        NSPhotoLibraryUsageDescription: Stub reads ticket stubs from your library. Nothing is uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub
        PRODUCT_NAME: Stub
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  StubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StubTests
    dependencies:
      - target: Stub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designedbybruno.stub.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stub:
    build:
      targets:
        Stub: all
        StubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [StubTests]
